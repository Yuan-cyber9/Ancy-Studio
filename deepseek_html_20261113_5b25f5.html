const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (s) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[s]));

const joinMeta = (items) => items.filter(Boolean).map(esc).join(" · ");

function renderProfile() {
  const p = DATA.profile;
  document.querySelector("#profile-name").textContent = p.name;
  document.querySelector("#profile-en").textContent = p.englishName;
  document.querySelector("#profile-early-life").textContent = p.earlyLife;
  document.querySelector("#updated-at").textContent = "数据更新：" + DATA.meta.updatedAt;

  const metaItems = [
    ["出生日期", p.birthDate + " · " + p.zodiac],
    ["出生地", p.birthplace],
    ["身高 / 体重", p.height + " / " + p.weight],
    ["血型", p.bloodType],
    ["职业", p.occupation],
    ["经纪公司", p.agency]
  ];
  document.querySelector("#profile-meta").innerHTML = metaItems.map(([label, value]) =>
    `<div class="meta-item"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`
  ).join("");

  document.querySelector("#profile-tags").innerHTML = p.tags.map((tag) =>
    `<span class="tag">${esc(tag)}</span>`
  ).join("");

  const aboutInfo = [
    ["姓名", p.name + "（" + p.englishName + "）"],
    ["出生日期", p.birthDate],
    ["星座", p.zodiac],
    ["出生地", p.birthplace],
    ["身高 / 体重", p.height + " / " + p.weight],
    ["血型", p.bloodType],
    ["职业", p.occupation],
    ["经纪公司", p.agency]
  ];
  document.querySelector("#about-info").innerHTML = aboutInfo.map(([label, value]) =>
    `<div class="info-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`
  ).join("");

  document.querySelector("#about-works").innerHTML = p.representativeWorks.map((work) =>
    `<li>${esc(work)}</li>`
  ).join("");

  document.querySelector("#about-achievements").innerHTML = p.achievements.map((item) =>
    `<li>${esc(item)}</li>`
  ).join("");
}

function renderFilmography() {
  const groups = [];
  DATA.filmography.forEach((item) => {
    let group = groups.find((g) => g.stage === item.stage);
    if (!group) {
      group = { stage: item.stage, items: [] };
      groups.push(group);
    }
    group.items.push(item);
  });

  document.querySelector("#filmography-list").innerHTML = groups.map((group) => `
    <div class="timeline-group">
      <h3>${esc(group.stage)}</h3>
      <div class="timeline">
        ${group.items.map((item) => `
          <article class="timeline-item">
            <div class="timeline-year">${esc(item.year)}</div>
            <div class="timeline-body">
              <h4>${esc(item.title)}<span class="pill">${esc(item.type)}</span></h4>
              <p class="meta-line">${joinMeta([
                item.role ? "饰 " + item.role : "",
                item.platform,
                item.date
              ])}</p>
              ${item.note ? `<p class="note">${esc(item.note)}</p>` : ""}
            </div>
          </article>
        `).join("")}
      </div>
    </div>
  `).join("");
}

function renderVariety() {
  document.querySelector("#variety-list").innerHTML = DATA.varietyShows.map((item) => `
    <article class="variety-card">
      <time>${esc(item.date)}</time>
      <h3>${esc(item.title)}</h3>
      <p class="meta-line">${joinMeta([item.platform, item.role, item.type])}</p>
      ${item.note ? `<p class="note">${esc(item.note)}</p>` : ""}
    </article>
  `).join("");
}

function mediaBlock(image, label) {
  return `
    <div class="media" data-label="${esc(label)}">
      ${image ? `<img src="${esc(image)}" alt="${esc(label)}" loading="lazy" onerror="this.remove()">` : ""}
    </div>
  `;
}

function renderEditorials() {
  const covers = DATA.editorials.magazineCovers;
  const photos = DATA.editorials.photoshoots;

  document.querySelector("#cover-grid").innerHTML = covers.map((item) => {
    const label = [item.magazine, item.issue].filter(Boolean).join(" ");
    return `
      <figure class="cover-card">
        ${mediaBlock(item.image, label)}
        <figcaption>
          <strong>${esc(item.magazine)}</strong>
          <span>${esc([item.issue, item.date].filter(Boolean).join(" · "))}</span>
          ${item.title ? `<p><strong style="font-size:13px;">${esc(item.title)}</strong></p>` : ""}
          ${item.description ? `<p>${esc(item.description)}</p>` : ""}
        </figcaption>
      </figure>
    `;
  }).join("");

  document.querySelector("#photo-grid").innerHTML = photos.map((item) => `
    <figure class="photo-card">
      ${mediaBlock(item.image, item.title)}
      <figcaption>
        <strong>${esc(item.title)}</strong>
        <span>${esc(item.date || "")}</span>
        ${item.description ? `<p>${esc(item.description)}</p>` : ""}
      </figcaption>
    </figure>
  `).join("");

  document.querySelector("#keyword-row").innerHTML = DATA.editorials.keywords.map((keyword) =>
    `<span class="tag">${esc(keyword)}</span>`
  ).join("");
}

function renderAwards() {
  document.querySelector("#awards-body").innerHTML = DATA.awards.map((item) => `
    <tr>
      <td>${esc(item.date)}</td>
      <td>${esc(item.award)}</td>
      <td>${esc(item.honor)}</td>
      <td>${esc(item.work || "—")}</td>
    </tr>
  `).join("");
}

renderProfile();
renderFilmography();
renderVariety();
renderEditorials();
renderAwards();
</script>
